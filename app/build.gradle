plugins {
    id 'com.android.application'
}

android {
    namespace 'com.f1championship.tracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.f1championship.tracker'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundled on-device model: screenshots are not sent to a server.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}